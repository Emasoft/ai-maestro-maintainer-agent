name: Plugin Validation

on:
  push:
    branches: [main, master]
    paths:
      - '.claude-plugin/**'
      - 'agents/**'
      - 'commands/**'
      - 'skills/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'rules/**'
      - '*.mcp.json'
      - '.lsp.json'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: false

      - name: Run CPV validation (--strict via remote launcher)
        run: |
          echo "=== CPV Plugin Validation (--strict) ==="
          set +e
          uvx --from git+https://github.com/Emasoft/claude-plugins-validation \
              --with pyyaml \
              cpv-remote-validate plugin . --strict --verbose --report validation-report.md
          EXIT_CODE=$?
          set -e

          # Exit codes: 0=PASS, 1=CRITICAL, 2=MAJOR, 3=MINOR, 4=NIT (strict)
          # Quality gate: ONLY exit 0 passes. All issues block.
          if [ $EXIT_CODE -eq 0 ]; then
            echo "=== Validation PASSED (--strict) ==="
          else
            echo "=== BLOCKED: Validation issues found (exit $EXIT_CODE) ==="
            cat validation-report.md 2>/dev/null || true
            exit $EXIT_CODE
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: validation-report
          path: validation-report.md
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Plugin Validation" >> "$GITHUB_STEP_SUMMARY"
          if [ -f validation-report.md ]; then
            cat validation-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # Static analysis of every workflow under .github/workflows/.
  # Runs zizmor (zizmorcore/zizmor) and uploads SARIF to GitHub
  # code-scanning so findings show up in the Security tab. The job's
  # `security-events: write` permission is the only place we grant
  # write scope — every other job stays at the contents:read default
  # set at the workflow level.
  workflow-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: false

      - name: Run zizmor (SARIF)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx zizmor --gh-token "$GH_TOKEN" --format=sarif .github/workflows/ \
            > zizmor.sarif

      - name: Upload SARIF to GitHub code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360  # v3.35.5
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Re-run zizmor (text, fail on findings)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor --gh-token "$GH_TOKEN" .github/workflows/

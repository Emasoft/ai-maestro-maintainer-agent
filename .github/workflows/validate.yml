name: Plugin Validation

on:
  push:
    branches: [main, master]
    paths:
      - '.claude-plugin/**'
      - 'agents/**'
      - 'commands/**'
      - 'skills/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'rules/**'
      - '*.mcp.json'
      - '.lsp.json'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs on the same ref (PR force-push / rapid main pushes)
# so we don't burn Actions minutes on stale work. Tag / release workflows
# (release.yml) intentionally do NOT enable this — every release tag deserves
# its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Hard cap. CPV strict is bounded; the only reason this could exceed 15 min
    # is a network flake on `uvx --from git+https://...`. Failing fast is better
    # than burning the default 360-min ceiling.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: false

      - name: Lint (ruff)
        # Local-vs-CI parity — `uv run ruff check` is part of pre-push but a
        # PR from a contributor without that hook would otherwise skip lint.
        # Fail-fast on any ruff finding (E/W/F/I/etc rules).
        run: |
          uv run ruff check scripts/ tests/

      - name: Type-check (mypy)
        # Same parity argument as ruff. `pyproject.toml [tool.mypy]` sets
        # `mypy_path = "scripts"` so `mypy scripts/` resolves intra-package
        # imports correctly. ignore-missing-imports is on for third-party.
        run: |
          uv run --with mypy mypy scripts/

      - name: Run unit tests (pytest)
        # 421 tests across 16 files. Docker-dependent tests auto-skip via
        # the @needs_docker / @needs_node_baseline guards in test_sandbox.py
        # — CI never has Docker, so those skip cleanly.
        run: |
          uv run --with pytest --with pytest-reportlog --with pyyaml \
            pytest tests/ -q

      - name: Run CPV validation (--strict via remote launcher)
        run: |
          echo "=== CPV Plugin Validation (--strict) ==="
          set +e
          uvx --from git+https://github.com/Emasoft/claude-plugins-validation \
              --with pyyaml \
              cpv-remote-validate plugin . --strict --verbose --report validation-report.md
          EXIT_CODE=$?
          set -e

          # Exit codes (strict mode): 0=ok, 1=critical, 2=major, 3=minor, 4=nit.
          # Quality gate: only exit 0 succeeds. All issues block.
          if [ $EXIT_CODE -eq 0 ]; then
            echo "=== Validation OK (--strict) ==="
          else
            echo "=== BLOCKED: Validation issues found (exit $EXIT_CODE) ==="
            cat validation-report.md 2>/dev/null || true
            exit $EXIT_CODE
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: validation-report
          path: validation-report.md
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Plugin Validation" >> "$GITHUB_STEP_SUMMARY"
          if [ -f validation-report.md ]; then
            cat validation-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # Static analysis of every workflow under .github/workflows/.
  # Runs zizmor (zizmorcore/zizmor) and uploads SARIF to GitHub
  # code-scanning so findings show up in the Security tab. The job's
  # `security-events: write` permission is the only place we grant
  # write scope — every other job stays at the contents:read default
  # set at the workflow level.
  workflow-security:
    runs-on: ubuntu-latest
    # zizmor scans 3 workflow files + SARIF upload. 10 min is generous.
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: false

      - name: Run zizmor (SARIF)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx zizmor --gh-token "$GH_TOKEN" --format=sarif .github/workflows/ \
            > zizmor.sarif

      - name: Upload SARIF to GitHub code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360  # v3.35.5
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Re-run zizmor (text, fail on findings)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor --gh-token "$GH_TOKEN" .github/workflows/

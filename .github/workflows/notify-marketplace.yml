# .github/workflows/notify-marketplace.yml
# Plugin-side notifier: tells the marketplace repo to refresh this plugin
# whenever plugin files change on the default branch.
#
# SETUP (one-time):
#   1. Create a PAT with 'repo' scope owned by a marketplace admin.
#   2. Export it as $MARKETPLACE_PAT in your shell (or load from a
#      .env file outside the repo — never commit it).
#   3. Run the helper to set the secret on BOTH the plugin repo AND
#      the marketplace repo:
#        uv run scripts/setup_marketplace_pat.py
#   4. Manual equivalent (always use `-b` for the value — the stdin
#      fallback path of `gh secret set` has failure modes that
#      produce subtly broken secrets):
#        gh secret set MARKETPLACE_PAT \
#          --repo Emasoft/ai-maestro-maintainer-agent \
#          -b "$MARKETPLACE_PAT"
#        gh secret set MARKETPLACE_PAT \
#          --repo Emasoft/ai-maestro-plugins \
#          -b "$MARKETPLACE_PAT"

name: Notify Marketplace

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
      - 'hooks/**'
      - 'commands/**'
      - 'agents/**'
      - 'skills/**'
      - 'scripts/**'

env:
  MARKETPLACE_OWNER: 'Emasoft'
  MARKETPLACE_REPO: 'ai-maestro-plugins'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    # Single API dispatch — 5 min is generous. If we exceed it, something is
    # very wrong with the marketplace repo's API responsiveness.
    timeout-minutes: 5
    steps:
      - name: Checkout plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Extract plugin name and version
        id: plugin
        run: |
          set -euo pipefail
          NAME=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['name'])")
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "ref=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify MARKETPLACE_PAT secret is present
        # Fail with a clear message before the dispatch step. Without this guard,
        # a missing or expired PAT surfaces as an opaque 401 from
        # peter-evans/repository-dispatch with no hint that the secret is the
        # cause — wastes triage time.
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          if [ -z "${MARKETPLACE_PAT:-}" ]; then
            echo "::error::MARKETPLACE_PAT secret is unset on this repo." >&2
            echo "::error::Run scripts/setup_marketplace_pat.py or set it manually:" >&2
            echo "::error::  gh secret set MARKETPLACE_PAT --repo ${{ github.repository }} -b \"\$MARKETPLACE_PAT\"" >&2
            exit 78
          fi

      - name: Dispatch plugin-updated to marketplace
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.MARKETPLACE_PAT }}
          repository: ${{ env.MARKETPLACE_OWNER }}/${{ env.MARKETPLACE_REPO }}
          event-type: plugin-updated
          client-payload: |
            {
              "plugin": "${{ steps.plugin.outputs.name }}",
              "version": "${{ steps.plugin.outputs.version }}",
              "ref": "${{ steps.plugin.outputs.ref }}",
              "source_repo": "${{ github.repository }}",
              "triggered_by": "${{ github.actor }}"
            }

      - name: Job summary
        env:
          PLUGIN_NAME: ${{ steps.plugin.outputs.name }}
          PLUGIN_VERSION: ${{ steps.plugin.outputs.version }}
          PLUGIN_REF: ${{ steps.plugin.outputs.ref }}
        run: |
          {
            echo "## Marketplace Notification"
            echo ""
            echo "- Plugin: $PLUGIN_NAME"
            echo "- Version: $PLUGIN_VERSION"
            echo "- Ref: $PLUGIN_REF"
            echo "- Target: ${MARKETPLACE_OWNER}/${MARKETPLACE_REPO}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# The GitHub release itself is created by scripts/publish.py using the
# git-cliff release notes, BEFORE the tag is pushed. This workflow runs
# AFTER the tag push as a post-hoc safety gate — it re-runs the strict
# CPV plugin validator and fails the workflow if the tagged state does
# not pass. A failed gate does NOT delete the already-created release;
# you must roll back manually.
#
# Rationale: publish.py already runs every validator locally before it
# pushes anything, so this gate is redundant on the happy path. Its
# purpose is to catch regressions where someone bypasses publish.py and
# pushes a tag directly — CI will flag the broken release.

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    # Hard cap so a hung uvx / network flake doesn't burn the 360-min default.
    # No `concurrency:` here — every tag deserves its own run (release tags
    # are sequential, never concurrent in practice).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: false

      - name: CPV strict validation gate (post-hoc safety net)
        run: |
          set +e
          # WHY: pin CPV to a release tag (not default-branch HEAD) so this security gate is reproducible — an unpinned ref runs whatever CPV HEAD is at release time (supply-chain drift, the exact class this plugin guards against); matches this plugin's own workflow-pin-actions doctrine. Keep in lockstep with publish.CPV_REF — tests/test_cpv_pin_alignment.py fails the build on any skew. A stale pin is not a safe pin: this sat 50 releases behind until 2026-08-07.
          uvx --from git+https://github.com/Emasoft/claude-plugins-validation@v5.3.0 \
            --with pyyaml \
            cpv-remote-validate plugin . --strict
          EXIT_CODE=$?
          set -e
          # Strict mode: ANY non-zero exit fails the gate. If the tag was
          # pushed by publish.py, this should always pass because publish.py
          # ran the same validator locally first. A failure here means
          # someone bypassed publish.py — investigate immediately.
          if [ $EXIT_CODE -ne 0 ]; then
            MSG1="CPV strict validation failed for tag $GITHUB_REF_NAME (exit $EXIT_CODE)"
            MSG2="Tag likely pushed bypassing the canonical publish pipeline"
            MSG3="The release (if any) should be rolled back by the maintainer"
            echo "::error::$MSG1"
            echo "::error::$MSG2"
            echo "::error::$MSG3"
            exit $EXIT_CODE
          fi

  supply-chain-artifacts:
    name: Attach SBOM, provenance attestation, and checksums to the release
    needs: validate-tag
    runs-on: ubuntu-latest
    # Same reasoning as validate-tag: hard cap, no concurrency group (tags
    # are sequential releases, never concurrent in practice).
    timeout-minutes: 15
    # Job-level permissions OVERRIDE the workflow-level `contents: read`
    # default above. Only THIS job gets write scopes — validate-tag stays
    # read-only. Least-privilege: exactly the 3 scopes the steps use.
    permissions:
      contents: write      # gh release upload attaches assets to the release
                            # publish.py already created (also covers
                            # checkout's read access — write is a superset
                            # of read on the same resource)
      id-token: write       # OIDC token so Sigstore can sign the
                            # build-provenance attestation
      attestations: write   # publish the attestation to this repo's
                            # GitHub-hosted attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build reproducible source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --output "dist/ai-maestro-maintainer-agent-${GITHUB_REF_NAME}.tar.gz" \
            HEAD

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/ai-maestro-maintainer-agent-${{ github.ref_name }}.spdx.json
          upload-artifact: false   # we upload to the release ourselves below;
                                   # don't also create a duplicate 90-day
                                   # workflow-run artifact

      - name: Compute SHA256SUMS
        working-directory: dist
        # Explicit filename patterns, never a bare `*` — at this point dist/
        # holds exactly the tarball + SBOM, but a bare glob would silently
        # re-hash whatever else ever lands in the directory (including a
        # stale SHA256SUMS from a re-run), corrupting `sha256sum -c` for
        # consumers. Naming exactly the two files this job produced removes
        # the ambiguity entirely.
        run: sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          # zizmor (template-injection, pedantic persona): a `${{ }}` expression
          # spliced directly into a `run:` block is expanded into the script
          # TEXT before the shell ever runs. github.repository isn't
          # attacker-controllable, but routing it through env: (like GH_TOKEN
          # above) is the standard mitigation and removes the finding entirely.
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --clobber --repo "$RELEASE_REPO"

# Dependabot keeps SHA-pinned GitHub Actions current.
#
# Background: workflow-pin-actions resolves every `uses: name@vN` to a
# 40-char commit SHA with a trailing `# vX.Y.Z` comment. Pinning is the
# first half of the supply-chain discipline (an attacker who compromises
# a maintainer cannot move the tag under your feet); Dependabot is the
# second half (a security patch upstream gets surfaced as a PR rather
# than sitting unnoticed forever on a stale SHA).
#
# Schedule is weekly to keep PR volume manageable; minor + patch updates
# are grouped into a single PR; major bumps land as individual PRs for
# manual review.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5

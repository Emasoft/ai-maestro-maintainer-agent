[project]
name = "ai-maestro-maintainer-agent"
version = "1.7.10"
description = "Autonomous MAINTAINER agent for Claude Code that polls a GitHub repository, triages issues, enforces the canonical approval-gate, and guards against supply-chain drift via a six-class Guardian (zizmor / actionlint / Sentinel-port / SHA-pin freshness / branch-rule drift / secret-leak / package-manager safety-knob drift)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Emasoft", email = "713559+Emasoft@users.noreply.github.com" },
]
maintainers = [
  { name = "Emasoft", email = "713559+Emasoft@users.noreply.github.com" },
]
keywords = [
  "ai-maestro",
  "claude-code",
  "github-actions",
  "supply-chain-security",
  "maintainer-agent",
  "sentinel",
  "zizmor",
  "actionlint",
  "dependabot",
  "branch-protection",
  "trdd",
  "adr",
  "sandbox",
  "docker",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = ["pyyaml"]

# Dev / test dependencies — kept out of `dependencies` so a downstream
# `pip install` of this plugin doesn't pull pytest / mypy / ruff onto the
# user's host. `uv sync` + `uv sync --group dev` is the test-env path.
# Why this matters: publish.py invokes `uv run pytest ...` which uses
# the project env. Without pytest in any group, uv falls back to tool-run
# (ephemeral env) where the runtime `pyyaml` dep is unavailable, breaking
# every test that touches the sandbox harness (yaml-loaded recipes).
[dependency-groups]
dev = [
  "pytest",
  "pytest-reportlog",
  "ruff",
  "mypy",
]

[project.urls]
Homepage = "https://github.com/Emasoft/ai-maestro-maintainer-agent"
Repository = "https://github.com/Emasoft/ai-maestro-maintainer-agent"
Issues = "https://github.com/Emasoft/ai-maestro-maintainer-agent/issues"
Changelog = "https://github.com/Emasoft/ai-maestro-maintainer-agent/blob/main/CHANGELOG.md"
"Security policy" = "https://github.com/Emasoft/ai-maestro-maintainer-agent/blob/main/SECURITY.md"
"Contributing guide" = "https://github.com/Emasoft/ai-maestro-maintainer-agent/blob/main/CONTRIBUTING.md"
"Code of Conduct" = "https://github.com/Emasoft/ai-maestro-maintainer-agent/blob/main/CODE_OF_CONDUCT.md"
"Acknowledgments" = "https://github.com/Emasoft/ai-maestro-maintainer-agent/blob/main/ACKNOWLEDGMENTS.md"

[tool.ruff]
line-length = 320

[tool.ruff.lint.per-file-ignores]
# Test-file conventions that ruff's strict rule set would otherwise flag:
#   D2xx — docstring style nits (we use pragmatic one-line + spec-link form)
#   S101 — `assert` is the standard pytest assertion
#   S603/S607 — subprocess + partial-executable-path: integration tests
#               legitimately shell out to git / gh / uv via PATH lookup
#   T201 — `print` is used by tests/run-all-tests.py for the result table
#   I001 — import sorting handled by formatter, not ruff
#   N806 — UPPER_SNAKE local vars in the result-table builder
#   INP001 — tests/ is intentionally NOT a package (pytest auto-discovers
#            via conftest.py; adding __init__.py breaks the discovery
#            invariant the test runner relies on)
"tests/**/*.py" = ["D205", "D212", "D213", "D301", "S101", "S603", "S607", "T201", "I001", "N806", "INP001"]

[tool.mypy]
ignore_missing_imports = true
# The `sentinel` package lives under scripts/ (run via `uv run
# scripts/sentinel_scan.py`, which puts scripts/ on sys.path). Tell mypy
# where to find it so intra-package imports resolve. Pyright reads the
# matching extraPaths from pyrightconfig.json.
mypy_path = "scripts"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

# AI Maestro Maintainer Agent - Agent Profile
# Quad-match: plugin.json name == TOML [agent].name == agents/<name>-main-agent.md

[agent]
name = "ai-maestro-maintainer-agent"
source = "plugin:ai-maestro-maintainer-agent"
path = "agents/ai-maestro-maintainer-agent-main-agent.md"
compatible-titles = ["MAINTAINER"]
compatible-clients = ["claude"]

[requirements]
project_type = "plugin"
tech_stack = ["python", "typescript", "rust", "go"]

[skills]
primary = ["maintainer-patrol", "maintainer-triage", "maintainer-fix", "maintainer-guardian", "maintainer-approval-gate"]
secondary = ["workflow-bootstrap", "workflow-scan", "workflow-fix-safe", "workflow-pin-actions", "workflow-protect-branch", "maintainer-sandbox"]
# Specialized = capabilities the agent applies on every entrusted downstream repo.
# Loaded on demand (not on every patrol cycle) — invoked by main agent flow or via slash command.
specialized = [
  "maintainer-redact",
  "maintainer-secrets-scan",
  "maintainer-pr-triage",
  "maintainer-pr-review",
  "maintainer-commit-msg-why",
  "maintainer-detect-stack",
  "maintainer-tool-bootstrap",
  "maintainer-config-lint",
  "maintainer-generate-docs",
  "maintainer-trdd-adr",
]

[agents]
recommended = []

[commands]
recommended = []

[rules]
recommended = []

[mcp]
recommended = ["serena-mcp", "llm-externalizer"]

[hooks]
recommended = []


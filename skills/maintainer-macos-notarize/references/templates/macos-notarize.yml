# macOS code-signing + notarization.
#
# Adapted from johannesjo/parallel-code's release.yml, whose ephemeral-keychain
# and App Store Connect API-key pattern is the right shape. Four things it did
# NOT have are added here, each because its absence is a real failure:
#
#   - timeout-minutes    (it had none -> the 6h job default; a hung notarize
#                         burns 360 runner-minutes at the macOS 10x multiplier)
#   - per-job permissions (it granted contents: write repo-wide, to every job)
#   - concurrency         (two tags in flight raced each other)
#   - stapler staple      (its electron-builder did this internally; a repo that
#                         does not use electron-builder ships an artifact that
#                         only validates ONLINE, and fails for an offline user)
#
# Required secrets:
#   MACOS_CERT_P12        Developer ID Application cert, base64
#   MACOS_CERT_PASSWORD   its export password
#   APPLE_API_KEY_P8      App Store Connect .p8 key, base64
#   APPLE_API_KEY_ID      the key's ID
#   APPLE_API_ISSUER_ID   the issuer UUID
#   APPLE_TEAM_ID         10-character team ID
name: Release (macOS)

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege at the top; the ONE job that needs to write says so itself.
permissions: {}

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-notarization

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45 # notarization can hang; do not inherit the 6h default
    permissions:
      contents: write # ONLY to upload the release asset

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The identity goes into a keychain that lives and dies with this job.
      # NEVER `security import` without -k: the default target is the LOGIN
      # keychain, and the cert then outlives the job on the runner.
      - name: Import signing certificate into an ephemeral keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"

          # Without this, codesign blocks on a GUI "allow access?" prompt that no
          # CI runner can ever answer — the job just hangs until the timeout.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          # Prepend, do not replace: the runner's default keychains stay usable.
          # The existing list is read into an ARRAY, not interpolated bare. An
          # unquoted $(...) here would word-split a keychain path containing a
          # space and silently drop the rest of the list. (macOS runners are on
          # bash 3.2, so no mapfile; and ${A[@]+"${A[@]}"} is the 3.2-safe way to
          # expand a possibly-empty array under `set -u`.)
          EXISTING=()
          while IFS= read -r kc; do
            [ -n "$kc" ] && EXISTING+=("$kc")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN" ${EXISTING[@]+"${EXISTING[@]}"}

      - name: Stage the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey.p8"

      # --- Build. Replace with your project's command. ------------------------
      - name: Build
        run: echo "REPLACE ME — produce the .app/.dmg/.pkg to sign"

      # --- Sign ---------------------------------------------------------------
      # --options runtime enables the Hardened Runtime. Notarization REJECTS a
      # binary without it, and the error message does not say so plainly.
      - name: Sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTIFACT: dist/YourApp.app
        run: |
          set -euo pipefail
          codesign --force --deep --timestamp --options runtime \
            --sign "Developer ID Application: ($APPLE_TEAM_ID)" "$ARTIFACT"
          codesign --verify --deep --strict --verbose=2 "$ARTIFACT"

      # --- Notarize + STAPLE --------------------------------------------------
      # notarytool takes a .zip/.dmg/.pkg, never a bare .app.
      #
      # `stapler staple` is the step people omit. Without it the ticket lives only
      # on Apple's servers, so the artifact validates on any machine that can reach
      # Apple — including every CI runner — and fails for a user who is offline or
      # behind a firewall. The bug is invisible in CI by construction.
      - name: Notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ARTIFACT: dist/YourApp.app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$ARTIFACT" "$RUNNER_TEMP/upload.zip"

          xcrun notarytool submit "$RUNNER_TEMP/upload.zip" \
            --key "$RUNNER_TEMP/private_keys/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m

          xcrun stapler staple "$ARTIFACT"
          xcrun stapler validate "$ARTIFACT"

          # The check that matters: would Gatekeeper let a user run this?
          spctl --assess --type execute --verbose=4 "$ARTIFACT"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: dist/YourApp.app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$ARTIFACT" "YourApp-${GITHUB_REF_NAME}.zip"
          gh release upload "$GITHUB_REF_NAME" "YourApp-${GITHUB_REF_NAME}.zip" --clobber

      # `if: always()` is the whole point. A job that fails mid-sign is exactly the
      # one that must not leave a signing identity and an API key on the runner.
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/private_keys/AuthKey.p8" "$RUNNER_TEMP/cert.p12" 2>/dev/null || true

# Python CI baseline.
# workflow-pin-actions converts every `@vN` to a 40-char commit SHA
# (with a trailing `# vX.Y.Z` comment) on the first run.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Type-check (mypy)
        run: uvx mypy .

      - name: Test (pytest)
        run: uvx pytest -q

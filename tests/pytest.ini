[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test
python_functions = test_*
# So `import conftest` and `import skill_helpers` resolve when pytest is
# invoked from the project root (uv run --with pytest pytest tests/).
addopts = -ra
# Suppress the warning that pytest_report_log is a non-built-in plugin —
# it's bundled with modern pytest.
filterwarnings =
    ignore::DeprecationWarning
